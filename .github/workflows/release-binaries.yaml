# Build the Windows binary package and draft a GitHub release with it attached.
# Runs on demand (workflow_dispatch) or when a v* tag is pushed.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

name: release-binaries

permissions:
  contents: write

jobs:
  windows-binary:
    runs-on: windows-latest
    name: windows binary
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Read package version
        id: pkg
        shell: bash
        run: |
          version=$(grep '^Version:' DESCRIPTION | sed 's/^Version:[[:space:]]*//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build source tarball
        shell: bash
        run: R CMD build --no-manual --compact-vignettes=gs+qpdf .

      - name: Build Windows binary
        shell: bash
        run: |
          tarball=$(ls CNVScope_*.tar.gz)
          R CMD INSTALL --build "$tarball"

      - name: Draft release with binaries
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ steps.pkg.outputs.version }}
          name: CNVScope ${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          files: |
            CNVScope_*.zip
            CNVScope_*.tar.gz

  macos-binary:
    runs-on: macos-latest
    name: macos binary
    needs: windows-binary
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Read package version
        id: pkg
        shell: bash
        run: |
          version=$(grep '^Version:' DESCRIPTION | sed 's/^Version:[[:space:]]*//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build source tarball
        shell: bash
        run: R CMD build --no-manual --compact-vignettes=gs+qpdf .

      - name: Build macOS binary
        shell: bash
        run: |
          tarball=$(ls CNVScope_*.tar.gz)
          R CMD INSTALL --build "$tarball"

      - name: Attach macOS binary to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ steps.pkg.outputs.version }}
          name: CNVScope ${{ steps.pkg.outputs.version }}
          files: |
            CNVScope_*.tgz
